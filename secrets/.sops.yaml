# One age key serves every machine; copy age/key.txt to a new machine instead of
# adding a key. See docs/operator-guide.md.
creation_rules:
  # Matches the plaintext input (secrets.yaml) and the encrypted output
  # (secrets.sops.yaml); excludes the committed secrets.yaml.example template.
  - path_regex: '(^|/)secrets(\.sops)?\.ya?ml$'
    age:
      - age15633vgpmczlwvex8qgyet64gqum57w48gd8z3h8hm9dln28z6qssy4mmll
