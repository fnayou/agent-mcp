name: Brand

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "brand/**"
      - "scripts/brand_generate.py"
      - ".github/workflows/brand.yml"

permissions:
  contents: read

jobs:
  brand:
    name: Brand assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install librsvg2-bin
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Brand check
        run: task brand:check
