[project]
site_name = "agent-mcp"
site_url = "https://fnayou.github.io/agent-mcp/"
site_description = "Declare every MCP server once and install it into Claude Code, Codex, OpenCode and Pi on macOS, Arch and Debian."
docs_dir = "website"
site_dir = "site"
repo_url = "https://github.com/fnayou/agent-mcp"

nav = [
    { "Home" = "index.md" },
    { "Getting started" = "getting-started.md" },
    { "Operator guide" = "operator-guide.md" },
    { "Servers" = "servers.md" },
    { "CI and brand" = "ci-and-brand.md" },
]

extra_css = ["stylesheets/macchiato.css"]

[project.theme]
language = "en"
custom_dir = "overrides"
logo = "assets/favicon.svg"
favicon = "assets/favicon.svg"
palette = [
    { scheme = "macchiato", primary = "custom", accent = "custom" },
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# The operator guide lives in docs/ and is included into the site with
# --8<-- so there is one copy. base_path is the repository root.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
