  <title>{{NAME}} logo</title>
  <!-- A plug: two prongs, a body with one inner bar, a short cable. MCP as a standard connector. -->
  <g transform="translate(12 8)">
    <rect x="12" y="0" width="12" height="26" rx="6" fill="{{ACCENT}}"/>
    <rect x="40" y="0" width="12" height="26" rx="6" fill="{{ACCENT}}"/>
    <rect x="0" y="20" width="64" height="34" rx="14" fill="{{TEXT}}"/>
    <rect x="14" y="32" width="36" height="10" rx="5" fill="{{BASE}}"/>
    <rect x="26" y="50" width="12" height="30" rx="6" fill="{{TEXT}}"/>
  </g>
  <text x="104" y="62" font-family="sans-serif" font-size="44" font-weight="700" fill="{{TEXT}}">{{NAME}}</text>
</svg>
