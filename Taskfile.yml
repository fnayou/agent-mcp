version: "3"

tasks:
  default:
    desc: List available project tasks
    cmds:
      - task --list

  doctor:
    desc: Check local project prerequisites
    cmds:
      - python3 scripts/doctor.py

  manifest:check:
    desc: Validate servers.yaml against servers.schema.json
    cmds:
      - uv run --quiet --locked --script scripts/manifest_check.py

  install:
    desc: Register every applicable server in each installed harness (--dry-run to preview)
    cmds:
      - uv run --quiet --locked --script scripts/installer.py install {{.CLI_ARGS}}

  sync:
    desc: Re-register after manifest edits and remove recorded servers it dropped (--dry-run to preview)
    cmds:
      - uv run --quiet --locked --script scripts/installer.py sync {{.CLI_ARGS}}

  uninstall:
    desc: Remove only the entries this repo recorded in the state file
    cmds:
      - uv run --quiet --locked --script scripts/installer.py uninstall

  test:
    desc: Run the installer test suite
    cmds:
      - uv run --quiet --locked --script tests/test_installer.py

  setup:
    desc: Initialize missing local configuration without overwriting files
    cmds:
      - python3 scripts/setup.py

  secrets:keygen:
    desc: Generate the age key in the host key directory, never overwriting one
    cmds:
      - mkdir -p -m 700 "${SOPS_AGE_KEY_DIR:-$HOME/.config/sops/age}"
      - docker compose -f compose.example.yaml run --rm --user "$(id -u):$(id -g)" age-keygen

  secrets:edit:
    desc: Edit secrets.sops.yaml with sops in a container
    interactive: true
    cmds:
      - docker compose -f compose.example.yaml run --rm --user "$(id -u):$(id -g)" sops edit secrets.sops.yaml

  secrets:decrypt:
    desc: Print secrets.sops.yaml decrypted to stdout, or to OUT (mode 600, outside the repo)
    cmds:
      - |
        if [ -z "{{.OUT}}" ]; then
          docker compose -f compose.example.yaml run --rm -T --user "$(id -u):$(id -g)" sops decrypt secrets.sops.yaml
        else
          out_dir="$(cd "$(dirname "{{.OUT}}")" && pwd -P)" || exit 1
          root="$(cd "{{.ROOT_DIR}}" && pwd -P)"
          case "$out_dir/" in
            "$root"/*) echo "refusing to write decrypted secrets inside the repository: {{.OUT}}" >&2; exit 1 ;;
          esac
          umask 077
          docker compose -f compose.example.yaml run --rm -T --user "$(id -u):$(id -g)" sops decrypt secrets.sops.yaml > "{{.OUT}}" || exit 1
          chmod 600 "{{.OUT}}"
        fi

  telegram:login:
    desc: One-time QR login for this machine, then migrate the session into the telegram-session volume
    interactive: true
    cmds:
      - sh scripts/telegram-compose.sh run --rm telegram-login

  telegram:up:
    desc: Decrypt the Telegram credentials outside the repo and start the shared server
    cmds:
      - sh scripts/telegram-compose.sh up -d telegram

  telegram:down:
    desc: Stop and remove the Telegram container, keeping the session volume
    cmds:
      - docker compose -f compose.example.yaml stop telegram
      - docker compose -f compose.example.yaml rm -f telegram

  telegram:logs:
    desc: Follow the Telegram server logs
    cmds:
      - docker compose -f compose.example.yaml logs -f telegram

  docker:config:
    desc: Validate Compose configuration without printing resolved values
    cmds:
      - docker compose -f compose.example.yaml config --quiet

  docker:start:
    desc: Start configured services without recreating containers
    cmds:
      - docker compose up -d --no-recreate

  docker:recreate:
    desc: Recreate services with current configuration
    cmds:
      - docker compose up -d --force-recreate

  docker:stop:
    desc: Stop services and preserve data
    cmds:
      - docker compose stop

  docker:down:
    desc: Remove services and networks while preserving volumes
    cmds:
      - docker compose down

  docker:logs:
    desc: Follow service logs
    cmds:
      - docker compose logs -f

  docker:ps:
    desc: List project services
    cmds:
      - docker compose ps
